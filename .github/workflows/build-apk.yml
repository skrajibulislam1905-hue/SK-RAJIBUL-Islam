name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository files
        run: |
          echo "Files in repository:"
          ls -la

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Gradle wrapper
        run: |
          echo "Searching for gradlew..."
          find . -name "gradlew" -type f -print

      - name: Build APK
        run: |
          GRADLEW=$(find . -name "gradlew" -type f | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found."
            exit 1
          fi

          echo "Using Gradle wrapper: $GRADLEW"

          chmod +x "$GRADLEW"

          PROJECT_DIR=$(dirname "$GRADLEW")
          cd "$PROJECT_DIR"

          "$PWD/gradlew" assembleDebug

      - name: Find APK
        run: |
          echo "Searching for APK files..."
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            /build/outputs/apk//*.apk
          if-no-files-found: error
